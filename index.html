<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORKKIT · 나의 작업 도구함</title>
<meta name="description" content="HEIC 변환, HEX 색상 추출, QR 코드 제작, 유튜브 다운로더를 한곳에서.">
<meta name="theme-color" content="#131313">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://workkit-tools.vercel.app/">
<meta property="og:title" content="WORKKIT · 나의 작업 도구함">
<meta property="og:description" content="HEIC 변환, HEX 색상 추출, QR 코드 제작을 한곳에서.">
<meta property="og:image" content="https://workkit-tools.vercel.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/assets/qrcode.min.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#131313;--surface:#202020;--sunken:#191b1a;--text:#f2f3f2;--sub:#bfc4c1;--line:#383a39;--line2:#454746;--accent:#09ebc1;--accent-bg:#24312e;--danger:#ff7a6e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;gap:12px;padding:20px max(20px,calc((100vw - 1240px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--bg)}
.name{font-size:20px;font-weight:900;letter-spacing:-.5px}
.label{color:var(--sub);font-size:12px;margin-left:6px}

main{max-width:1296px;margin:0 auto;padding:36px 28px 48px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}
h1{font-size:38px;line-height:1.3;font-weight:900;letter-spacing:-1.5px;margin:10px 0}
.lead{color:var(--sub);margin:0 0 28px;font-weight:500}

.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.filter{border:1px solid transparent;border-radius:8px;padding:8px 14px;background:none;color:var(--sub);font-weight:700}
.filter[aria-pressed=true]{background:var(--bg);color:var(--text);border-color:var(--accent);font-weight:800}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px;color:var(--sub)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none}
.search input::placeholder{color:var(--sub)}
.grid{display:grid;gap:10px}
.tool{display:flex;flex-direction:column;text-align:left;padding:18px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s,transform .15s}
.tool:hover{border-color:var(--accent);transform:translateY(-1px)}
.tool[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.tool-top{display:flex;justify-content:space-between;align-items:center}
.tool-icon{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--accent);font-size:19px}
.tool-cat{font-size:11px;color:var(--sub)}
.tool h3{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:12px 0 4px}
.tool p{color:var(--sub);font-size:13px;margin:0 0 14px;font-weight:500}
.tool-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--sub)}
.tool-open{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--text)}
.tool-open .ic{color:var(--accent);font-size:15px}
.no-result{color:var(--sub);text-align:center;padding:28px 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;min-height:560px;scroll-margin-top:16px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.panel-title{font-size:23px;font-weight:800;letter-spacing:-.5px}
.ghost{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px;color:var(--sub)}
.empty{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.empty .ic{font-size:32px;color:var(--accent)}
.empty h3{color:var(--text);margin:18px 0 4px;font-size:21px}
.empty p{margin:0}
.note{font-size:12px;color:var(--sub);margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--text);font-weight:700;text-decoration:none}
.btn:hover:not(:disabled){background:var(--accent-bg)}
.btn.primary{background:var(--accent);color:#06221c;border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:7px 11px;font-size:12px;border-color:var(--line2)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger);background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack.stack>*+*{margin-top:16px}
.status{color:var(--sub);margin:0;min-height:1.6em}
.status.err{color:var(--danger)}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:8px}
.input,textarea,select{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;outline:0}
.input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical;display:block}
.counter{font-size:12px;color:var(--sub);text-align:right;margin-top:6px}
.counter.over{color:var(--danger)}
.hint{font-size:13px;color:var(--sub);background:var(--sunken);padding:12px 14px;border-radius:8px;margin:0}
.warn{color:#ffc061}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--sub);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--sunken)}
.drop .ic{font-size:26px;color:var(--accent)}
.drop strong{color:var(--text)}
.drop small{font-size:12px}
.preview{display:block;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.opts{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;max-width:360px}
.opts label{color:var(--sub);font-weight:600}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.qr{width:min(100%,280px);border-radius:10px;overflow:hidden;line-height:0}
.qr svg{width:100%;height:auto}

canvas{display:block;max-width:100%;height:auto;border-radius:8px;cursor:crosshair}
.swatch{width:40px;height:40px;border-radius:8px;border:1px solid #777}
.hexval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

.history h4{margin:0 0 10px;font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunken)}
.hist img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--bg)}
.hist .meta{flex:1;min-width:0;font-size:12px;color:var(--sub)}
.hist .meta b{display:block;color:var(--text);font-size:13px}

.dl-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.dl-meta dt{color:var(--sub)}
.dl-meta dd{margin:0;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
ol.steps{margin:0;padding-left:20px;color:var(--sub)}
ol.steps li+li{margin-top:4px}

footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px;color:var(--sub);font-size:11px;flex-wrap:wrap}

@media(max-width:759px){
 main{padding:24px 16px 40px}
 h1{font-size:29px}
 .label{display:none}
 .workspace{grid-template-columns:1fr;gap:20px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tool{padding:14px}.tool h3{font-size:16px}.tool p{display:none}
 .tool-foot{flex-wrap:wrap;gap:6px}
 .panel{padding:20px;min-height:0}
 .empty{min-height:200px}
 .panel-title{font-size:20px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><span class="logo"><i data-i="command"></i></span><span class="name">WORKKIT</span><span class="label">나의 작은 작업 도구함</span></header>
<main>
 <div class="eyebrow">YOUR EVERYDAY TOOLBOX</div>
 <h1>필요한 도구, 한곳에서.</h1>
 <p class="lead">웹에서 바로 쓰거나, 필요한 도구를 내려받으세요.</p>
 <div class="workspace">
  <aside aria-label="도구 목록">
   <div class="filters" role="group" aria-label="분류">
    <button class="filter" data-cat="전체" aria-pressed="true">전체</button>
    <button class="filter" data-cat="이미지" aria-pressed="false">이미지</button>
    <button class="filter" data-cat="영상" aria-pressed="false">영상</button>
    <button class="filter" data-cat="유틸리티" aria-pressed="false">유틸리티</button>
   </div>
   <label class="search"><i data-i="search"></i><input type="search" placeholder="도구 검색" aria-label="도구 검색"></label>
   <div class="grid">
    <button class="tool" data-id="heic" data-kind="이미지" data-tags="아이폰 사진 jpg png 변환 heic"><span class="tool-top"><span class="tool-icon"><i data-i="images"></i></span><span class="tool-cat">이미지</span></span><h3>HEIC 변환기</h3><p>아이폰 사진을 JPG·PNG로 한 번에 변환</p><span class="tool-foot"><span>WINDOWS · ZIP</span><span class="tool-open">열기 <i data-i="arrow-up-right"></i></span></span></button>
    <button class="tool" data-id="hex" data-kind="이미지" data-tags="색상 컬러 rgb 스포이드 hex"><span class="tool-top"><span class="tool-icon"><i data-i="pipette"></i></span><span class="tool-cat">이미지</span></span><h3>HEX 코드 추출기</h3><p>사진 속 색을 클릭해 HEX·RGB 추출</p><span class="tool-foot"><span>HEX / RGB</span><span class="tool-open">열기 <i data-i="arrow-up-right"></i></span></span></button>
    <button class="tool" data-id="yt" data-kind="영상" data-tags="youtube 영상 다운로드 mp4"><span class="tool-top"><span class="tool-icon"><i data-i="youtube"></i></span><span class="tool-cat">영상</span></span><h3>유튜브 다운로드</h3><p>Windows용 다운로드 프로그램</p><span class="tool-foot"><span>WINDOWS · ZIP</span><span class="tool-open">열기 <i data-i="arrow-up-right"></i></span></span></button>
    <button class="tool" data-id="qr" data-kind="유틸리티" data-tags="qr 큐알 링크 텍스트 이미지 업로드"><span class="tool-top"><span class="tool-icon"><i data-i="qr-code"></i></span><span class="tool-cat">유틸리티</span></span><h3>QR 코드 제작툴</h3><p>링크·텍스트·이미지를 QR로</p><span class="tool-foot"><span>PNG / SVG</span><span class="tool-open">열기 <i data-i="arrow-up-right"></i></span></span></button>
    <p class="no-result" hidden>검색 결과가 없습니다.</p>
   </div>
  </aside>
  <section class="panel" aria-live="polite">
   <div class="panel-top"><strong class="panel-title">도구 선택</strong><button class="ghost" id="close" hidden>닫기</button></div>
   <div id="body"></div>
   <p class="note" id="note" hidden></p>
  </section>
 </div>
 <footer><span>WORKKIT · 자주 쓰는 도구를 가볍게</span><span>PERSONAL TOOLBOX</span></footer>
</main>
<script>
(()=>{
const ICONS={
command:'<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
images:'<path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/>',
pipette:'<path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>',
youtube:'<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
'qr-code':'<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
'arrow-up-right':'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
pointer:'<path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
external:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const paint=el=>el.querySelectorAll('i[data-i]').forEach(i=>i.outerHTML=icon(i.dataset.i));
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
paint(document);

const body=$('#body'),note=$('#note'),title=$('.panel-title'),closeBtn=$('#close'),panel=$('.panel');
const cards=[...document.querySelectorAll('.tool')],search=$('.search input'),noResult=$('.no-result');
let cat='전체';

/* ---------- 목록 필터 ---------- */
function filter(){
 const q=search.value.trim().toLowerCase();let shown=0;
 cards.forEach(c=>{const hay=(c.textContent+' '+c.dataset.tags).toLowerCase();const ok=(cat==='전체'||c.dataset.kind===cat)&&(!q||hay.includes(q));c.hidden=!ok;if(ok)shown++});
 noResult.hidden=shown>0;
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filter()});
search.oninput=filter;

function setNote(t){note.textContent=t||'';note.hidden=!t}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function status(el,msg,err){el.textContent=msg||'';el.classList.toggle('err',!!err)}
function fmtSize(n){return n<1024?n+'B':n<1048576?Math.round(n/1024)+'KB':(n/1048576).toFixed(1)+'MB'}
async function copy(text,el){try{await navigator.clipboard.writeText(text);status(el,'복사했습니다.')}catch{status(el,'복사하지 못했습니다. 직접 선택해 복사하세요.',true)}}

/* 파일 선택 영역(클릭 + 드래그앤드롭) */
function dropzone(el,input,onFile){
 input.onchange=()=>input.files[0]&&onFile(input.files[0]);
 ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('over')}));
 ['dragleave','drop'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.remove('over')}));
 el.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)onFile(f)});
}
const dropHTML=(id,accept,label,sub)=>`<label class="drop" id="${id}-drop"><i data-i="upload"></i><strong>${label}</strong><small>${sub}</small><input id="${id}" class="sr" type="file" accept="${accept}"></label>`;

/* ---------- 빈 화면 ---------- */
function emptyView(){
 title.textContent='도구 선택';closeBtn.hidden=true;setNote('');
 body.innerHTML='<div class="empty"><i data-i="pointer"></i><h3>어떤 작업을 하시나요?</h3><p>도구를 선택하면 이곳에 표시됩니다.</p></div>';paint(body);
 cards.forEach(x=>x.setAttribute('aria-pressed','false'));
}

/* ---------- HEX 추출기 ---------- */
function hexTool(){
 body.innerHTML=`<div class="stack">${dropHTML('hex-file','image/*','이미지 선택 또는 끌어놓기','JPG · PNG · WEBP · GIF')}<p class="status" id="hex-status"></p><canvas hidden aria-label="색상을 추출할 이미지"></canvas><div class="row" id="hex-result" hidden><span class="swatch"></span><span class="hexval"></span><span class="rgbval" style="color:var(--sub)"></span><button class="btn sm" id="hex-copy">${icon('copy')} 복사</button></div></div>`;paint(body);
 setNote('이미지는 서버로 전송되지 않습니다.');
 const canvas=$('canvas',body),ctx=canvas.getContext('2d',{willReadFrequently:true}),st=$('#hex-status'),res=$('#hex-result');let hex='';
 dropzone($('#hex-file-drop'),$('#hex-file'),f=>{
  res.hidden=true;const u=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const s=Math.min(1,1600/img.width,1600/img.height);canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.hidden=false;status(st,'원하는 지점을 클릭하세요.');URL.revokeObjectURL(u)};
  img.onerror=()=>{status(st,'열 수 없는 이미지입니다.',true);URL.revokeObjectURL(u)};img.src=u;
 });
 canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=Math.min(canvas.width-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*canvas.width))),y=Math.min(canvas.height-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*canvas.height))),[R,G,B]=ctx.getImageData(x,y,1,1).data;
  hex='#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();$('.hexval',res).textContent=hex;$('.rgbval',res).textContent=`RGB(${R}, ${G}, ${B})`;$('.swatch',res).style.background=hex;res.hidden=false;status(st,'')};
 $('#hex-copy').onclick=()=>copy(hex,st);
}

/* ---------- 다운로드 도구 ---------- */
const DL={
 heic:{file:'/downloads/heic-converter-v3.zip',ver:'v3',size:'7KB',sha:'6d8dfbe003c846185aac3c4225df341c890ad68b7b4fcbdb3cb06d01a0c84271',steps:['ZIP 압축을 모두 풉니다.','RUN_ME.cmd를 실행합니다.','첫 실행 때 변환 엔진(ImageMagick)을 내려받습니다.']},
 yt:{file:'/downloads/youtube-downloader-v3.zip?v=3.4',ver:'v3.4',size:'5.5MB',sha:'f23ab04775ac84826a58237ea5c67aa74c8da6bfd518e0f53c9f5250b373cb2d',steps:['ZIP 압축을 모두 풉니다.','WORKKIT_YouTube_Downloader.exe를 실행합니다.','링크와 화질은 프로그램에서 고릅니다.'],warn:'본인 소유이거나 허락받은 영상에만 사용하세요.'}
};
function dlTool(id){
 const d=DL[id];
 body.innerHTML=`<div class="stack"><ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol><a class="btn primary" href="${d.file}" download>${icon('download')} 다운로드 · ${d.size}</a><dl class="dl-meta"><dt>버전</dt><dd>${d.ver} · Windows</dd><dt>SHA-256</dt><dd class="mono">${d.sha}</dd></dl><p class="hint">Windows 보호 창이 뜨면 <b>추가 정보 → 실행</b>을 누르세요.</p></div>`;
 setNote(d.warn||'');
}

/* ---------- QR 제작툴 ---------- */
const HKEY='workkit-uploads',KEEP_DAYS=30,QR_MAX=2331;
function loadHist(){
 let h=[];try{h=JSON.parse(localStorage.getItem(HKEY)||'[]');const old=JSON.parse(localStorage.getItem('workkit-image-last')||'null');if(old&&old.url&&!h.some(x=>x.pathname===old.pathname))h.push({...old,at:Date.parse(old.pathname.split('/')[1])||Date.now()});localStorage.removeItem('workkit-image-last')}catch{}
 const now=Date.now();return h.filter(x=>x&&typeof x.url==='string'&&/^https:\/\//.test(x.url)&&x.pathname&&x.deleteKey&&now-x.at<KEEP_DAYS*864e5);
}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch{}}

/* 업로드 전 재인코딩: 위치정보(EXIF 등) 제거 + 긴 변 2560px 이하로 축소 */
async function cleanImage(f){
 if(f.type==='image/gif')return f; // 움직이는 GIF 보존 (GIF에는 촬영 위치 정보가 없음)
 let src;try{src=await createImageBitmap(f,{imageOrientation:'from-image'})}catch{src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
 const w=src.width,h=src.height,s=Math.min(1,2560/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
 c.getContext('2d').drawImage(src,0,0,c.width,c.height);src.close?.();
 const enc=(t,q)=>new Promise(r=>c.toBlob(r,t,q));
 let out=f.type==='image/png'?await enc('image/png'):await enc(f.type==='image/webp'?'image/webp':'image/jpeg',.9);
 if(!out||out.size>4*1024*1024)out=await enc('image/webp',.85);
 if(!out||out.size>4*1024*1024)out=await enc('image/jpeg',.75);
 return out;
}
function contrast(hex){const l=hex.match(/\w\w/g).map(v=>{v=parseInt(v,16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});const L=.2126*l[0]+.7152*l[1]+.0722*l[2];return 1.05/(L+.05)}

function qrTool(){
 body.innerHTML=`<div class="stack">
  <div class="seg" role="group" aria-label="QR 유형"><button data-mode="url" aria-pressed="true">링크</button><button data-mode="text" aria-pressed="false">텍스트</button><button data-mode="upload" aria-pressed="false">이미지 업로드</button></div>
  <div id="text-area"><label class="field"><span id="qr-label">웹페이지 주소</span><textarea id="qr-text" placeholder="https://example.com"></textarea></label><div class="counter" id="qr-count"></div></div>
  <div id="up-area" hidden class="stack">
   ${dropHTML('qr-file','image/jpeg,image/png,image/webp,image/gif','이미지 선택 또는 끌어놓기','JPG · PNG · WEBP · GIF')}
   <div id="up-pick" hidden class="stack"><img class="preview" alt="선택한 이미지 미리보기"><div class="row"><button class="btn primary" id="up-go">${icon('upload')} 업로드하고 QR 만들기</button><span class="status" id="up-name"></span></div></div>
   <div id="up-done" hidden><label class="field"><span>공유 주소</span><input class="input mono" id="up-url" readonly></label><div class="row" style="margin-top:10px"><button class="btn sm" id="up-copy">${icon('copy')} 주소 복사</button><a class="btn sm" id="up-open" target="_blank" rel="noopener noreferrer">${icon('external')} 열기</a></div></div>
  </div>
  <div class="opts"><label for="qr-color">코드 색상</label><input id="qr-color" type="color" value="#131313"><label for="qr-margin">여백</label><select id="qr-margin"><option value="4">기본</option><option value="6">넉넉하게</option><option value="8">넓게</option></select></div>
  <button class="btn primary" id="qr-go">QR 만들기</button>
  <p class="status" id="qr-status" role="status"></p>
  <div id="qr-out" hidden class="stack"><div class="qr"></div><div class="row"><button class="btn sm" id="png">${icon('download')} PNG</button><button class="btn sm" id="svg">${icon('download')} SVG</button></div></div>
  <div class="history" id="hist" hidden><h4>내 업로드 <small style="color:var(--sub);font-weight:400">· ${KEEP_DAYS}일 후 자동 삭제</small></h4><ul class="hist"></ul></div>
 </div>`;
 const st=$('#qr-status'),out=$('#qr-out'),box=$('.qr',out),input=$('#qr-text'),count=$('#qr-count'),color=$('#qr-color'),margin=$('#qr-margin'),go=$('#qr-go');
 let mode='url',svg='',current='',file=null,busy=false,hist=loadHist(),pv='';saveHist(hist);

 const notes={url:'입력 내용은 서버로 전송되지 않습니다.',text:'입력 내용은 서버로 전송되지 않습니다.',upload:`업로드한 이미지는 링크가 있으면 누구나 볼 수 있고, ${KEEP_DAYS}일 후 자동 삭제됩니다.`};
 function setMode(m){
  mode=m;body.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  $('#text-area').hidden=m==='upload';$('#up-area').hidden=m!=='upload';go.hidden=m==='upload';
  $('#qr-label').textContent=m==='text'?'담을 텍스트':'웹페이지 주소';input.placeholder=m==='text'?'QR에 담을 내용':'https://example.com';
  setNote(notes[m]);clear();updCount();renderHist();
 }
 function clear(){out.hidden=true;svg='';status(st,'')}
 function updCount(){const n=new TextEncoder().encode(input.value).length;count.textContent=n?`${n.toLocaleString()} / ${QR_MAX.toLocaleString()}바이트`:'';count.classList.toggle('over',n>QR_MAX)}

 function make(value){
  clear();
  if(typeof qrcode!=='function'){status(st,'QR 모듈을 불러오지 못했습니다. 새로고침하세요.',true);return}
  try{
   const qr=qrcode(0,'M');qr.addData(value,'Byte');qr.make();
   const c=color.value,m=Number(margin.value),n=qr.getModuleCount(),size=n+m*2;let d='';
   for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))d+=`M${x+m},${y+m}h1v1h-1z`;
   svg=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="${c}"/></svg>`;
   box.innerHTML=svg;out.hidden=false;current=value;
   const low=contrast(c)<3;status(st,low?'색이 연해서 인식이 어려울 수 있습니다. 더 진한 색을 권장합니다.':'완성! 휴대폰으로 스캔해 확인하세요.');st.classList.toggle('warn',low);
  }catch{status(st,'내용이 너무 깁니다. 줄여주세요.',true)}
 }
 function fromInput(){
  const v=input.value.trim();
  if(!v)return status(st,mode==='text'?'텍스트를 입력하세요.':'주소를 입력하세요.',true);
  if(mode==='url'){try{const u=new URL(v);if(!/^https?:$/.test(u.protocol))throw 0}catch{return status(st,'http:// 또는 https://로 시작하는 주소를 입력하세요.',true)}}
  if(new TextEncoder().encode(v).length>QR_MAX)return status(st,'내용이 너무 깁니다. 줄여주세요.',true);
  make(v);
 }

 function showDone(item){$('#up-done').hidden=false;$('#up-url').value=item.url;$('#up-open').href=item.url}
 function renderHist(){
  const wrap=$('#hist'),ul=$('ul',wrap);wrap.hidden=mode!=='upload'||!hist.length;
  ul.innerHTML=hist.slice().reverse().map(h=>{const left=Math.max(1,Math.ceil((h.at+KEEP_DAYS*864e5-Date.now())/864e5)),d=new Date(h.at);
   return `<li data-p="${esc(h.pathname)}"><img src="${esc(h.url)}" alt="" loading="lazy"><span class="meta"><b>${d.getMonth()+1}.${d.getDate()} 업로드</b>${left}일 후 삭제</span><button class="btn sm" data-act="qr">QR</button><button class="btn sm danger" data-act="del" aria-label="삭제">${icon('trash')}</button></li>`}).join('');
 }
 $('#hist').onclick=async e=>{
  const b=e.target.closest('button');if(!b||busy)return;const li=b.closest('li'),item=hist.find(h=>h.pathname===li.dataset.p);if(!item)return;
  if(b.dataset.act==='qr'){showDone(item);make(item.url);return}
  if(!confirm('이 이미지를 삭제할까요? 주소와 QR로 더 이상 열 수 없습니다.'))return;
  busy=true;b.disabled=true;
  try{const r=await fetch('/api/upload',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({pathname:item.pathname,deleteKey:item.deleteKey})});const d=await r.json().catch(()=>({}));
   if(!r.ok&&r.status!==404)throw new Error(d.error||'삭제하지 못했습니다.');
   hist=hist.filter(h=>h!==item);saveHist(hist);renderHist();if(current===item.url){clear();$('#up-done').hidden=true}status(st,'삭제했습니다.');
  }catch(err){status(st,err.message,true);b.disabled=false}finally{busy=false}
 };

 dropzone($('#qr-file-drop'),$('#qr-file'),f=>{
  clear();$('#up-done').hidden=true;
  if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)){$('#up-pick').hidden=true;return status(st,'JPG, PNG, WEBP, GIF만 가능합니다.',true)}
  if(f.size>20*1024*1024){$('#up-pick').hidden=true;return status(st,'20MB 이하 이미지를 선택하세요.',true)}
  file=f;if(pv)URL.revokeObjectURL(pv);pv=URL.createObjectURL(f);$('#up-pick img').src=pv;$('#up-pick').hidden=false;$('#up-name').textContent=`${f.name} · ${fmtSize(f.size)}`;
 });
 $('#up-go').onclick=async()=>{
  if(!file||busy)return;const b=$('#up-go');busy=true;b.disabled=true;clear();status(st,'업로드 중…');
  try{
   const blob=await cleanImage(file);
   if(blob.type==='image/gif'&&blob.size>4*1024*1024)throw new Error('GIF는 4MB까지 올릴 수 있습니다.');
   const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':blob.type},body:blob,signal:AbortSignal.timeout(30000)});
   const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'업로드하지 못했습니다.');
   const item={url:d.url,pathname:d.pathname,deleteKey:d.deleteKey,at:Date.now()};hist.push(item);saveHist(hist);
   if(!document.body.contains(b))return;
   file=null;$('#up-pick').hidden=true;$('#qr-file').value='';showDone(item);renderHist();make(item.url);
  }catch(e){status(st,e.name==='TimeoutError'?'응답이 늦습니다. 잠시 후 다시 시도하세요.':e.message||'업로드하지 못했습니다.',true)}
  finally{busy=false;b.disabled=false}
 };
 $('#up-copy').onclick=()=>copy($('#up-url').value,st);

 body.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>!busy&&setMode(b.dataset.mode));
 input.oninput=()=>{clear();updCount()};
 input.onkeydown=e=>{if(e.key==='Enter'&&(mode==='url'||e.ctrlKey||e.metaKey)){e.preventDefault();fromInput()}};
 go.onclick=fromInput;
 color.oninput=margin.onchange=()=>{if(current&&svg)make(current)};
 $('#svg').onclick=()=>svg&&save(new Blob([svg],{type:'image/svg+xml'}),'workkit-qr.svg');
 $('#png').onclick=()=>{if(!svg)return;const img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(img,0,0,1024,1024);c.toBlob(b=>{if(b)save(b,'workkit-qr.png');URL.revokeObjectURL(u)},'image/png')};img.onerror=()=>{status(st,'PNG 저장 실패. SVG로 저장하세요.',true);URL.revokeObjectURL(u)};img.src=u};
 setMode('url');
}

/* ---------- 카드 선택 ---------- */
const TOOLS={heic:()=>dlTool('heic'),yt:()=>dlTool('yt'),hex:hexTool,qr:qrTool};
cards.forEach(c=>c.onclick=()=>{
 cards.forEach(x=>x.setAttribute('aria-pressed',String(x===c)));
 title.textContent=$('h3',c).textContent;closeBtn.hidden=false;setNote('');TOOLS[c.dataset.id]();
 history.replaceState(null,'','#'+c.dataset.id);
 if(innerWidth<760)panel.scrollIntoView({behavior:'smooth',block:'start'});
});
closeBtn.onclick=()=>{emptyView();history.replaceState(null,'',location.pathname)};
const start=cards.find(c=>c.dataset.id===location.hash.slice(1));
start?start.click():emptyView();
})();
</script>
