<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORKKIT · 나의 작업 도구함</title>
<meta name="description" content="배경 제거, 색상 팔레트 생성, HEIC 변환, PDF 편집, QR 코드 제작 등 업무 도구를 한곳에서.">
<meta name="theme-color" content="#131313">
<script>try{if(localStorage.getItem('workkit-theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]').content='#ffffff'}}catch(e){}</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://workkit-tools.vercel.app/">
<meta property="og:title" content="WORKKIT · 나의 작업 도구함">
<meta property="og:description" content="HEIC 변환, HEX 색상 추출, PDF 도구, QR 코드 제작을 한곳에서.">
<meta property="og:image" content="https://workkit-tools.vercel.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/assets/qrcode.min.js" defer></script>
<style>
/* ---- 테마 토큰 (다크 기본 / 라이트는 html[data-theme=light]) ---- */
:root{color-scheme:dark;
 --bg:#131313;--surface:#202020;--sunken:#191b1a;--text:#f2f3f2;--sub:#bfc4c1;--line:#383a39;--line2:#454746;
 --accent:#09ebc1;--ink:#09ebc1;--accent-bg:#24312e;--on-accent:#06221c;--danger:#ff7a6e;--warn:#ffc061;
 --violet:#a78bfa;--violet-ink:#b9a3ff;--violet-bg:#2a2540;--glow:9,235,193;--vglow:167,139,250;
 --glass:rgba(32,32,32,.86);--panel:rgba(32,32,32,.92);--pop-bg:rgba(30,30,30,.94);--field:rgba(32,32,32,.8);
 --tile-a:#242424;--tile-b:#1a1a1a;--tile-ha:#26302d;--tile-hb:#1b1f1e;--icon-bg:#1a1f1e;--page-bg:#2a2a2a;
 --dot:rgba(255,255,255,.11);--spot:rgba(9,235,193,.075);--shadow:rgba(0,0,0,.7);
 --fs:15px;--tile:clamp(70px,3.2vw + 48px,96px);--gutter:clamp(16px,3vw,28px)}
html[data-theme=light]{color-scheme:light;
 --bg:#ffffff;--surface:#f7f8f8;--sunken:#f2f4f3;--text:#171717;--sub:#575e5b;--line:#e3e6e5;--line2:#cdd3d0;
 --accent:#12cfa9;--ink:#00826b;--accent-bg:#e2f7f2;--danger:#cc3527;--warn:#9a5600;
 --violet:#7c3aed;--violet-ink:#6d28d9;--violet-bg:#f1eafe;--glow:18,207,169;--vglow:124,58,237;
 --glass:rgba(255,255,255,.84);--panel:rgba(255,255,255,.95);--pop-bg:rgba(255,255,255,.97);--field:#fff;
 --tile-a:#ffffff;--tile-b:#f3f5f4;--tile-ha:#f2fcf9;--tile-hb:#e5f7f2;--icon-bg:#ecfaf6;--page-bg:#e8ebea;
 --dot:rgba(0,0,0,.13);--spot:rgba(18,207,169,.13);--shadow:rgba(20,40,34,.16)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line2) transparent}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.65 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
::selection{background:rgba(var(--glow),.3)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:16px max(var(--gutter),calc((100vw - 1240px)/2));padding-top:max(16px,env(safe-area-inset-top));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--bg);color:var(--text)}
.name{font-size:20px;font-weight:900;letter-spacing:-.5px}
.label{color:var(--sub);font-size:13px;margin-left:4px}

main{flex:1 0 auto;width:100%;max-width:1296px;margin:0 auto;padding:clamp(24px,4vw,44px) var(--gutter) 48px}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;border-radius:12px;margin:-4px;padding:4px}
.brand:hover .logo{box-shadow:0 0 0 3px rgba(var(--glow),.18)}
.brand:hover .name{color:var(--ink)}
.logo,.name{transition:color .15s,box-shadow .15s}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--ink);font-weight:800}
h1{font-size:clamp(28px,2.2vw + 18px,42px);line-height:1.28;font-weight:900;letter-spacing:-.04em;margin:10px 0 8px;text-wrap:balance}
.lead{color:var(--sub);margin:0 0 28px;font-weight:500;font-size:clamp(14px,.3vw + 13px,16px)}

/* ---- 손전등(스포트라이트) 배경 ---- */
.spot,.dots{position:fixed;inset:0;pointer-events:none;z-index:0}
.spot{background:radial-gradient(560px circle at var(--mx,50%) var(--my,35%),var(--spot),transparent 62%)}
.dots{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;
 -webkit-mask-image:radial-gradient(340px circle at var(--mx,50%) var(--my,35%),#000,transparent 72%);mask-image:radial-gradient(340px circle at var(--mx,50%) var(--my,35%),#000,transparent 72%)}
.top,main{z-index:1}main{position:relative}.top{z-index:10}

/* ---- 런처 ---- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filter{border:1px solid transparent;border-radius:9px;padding:8px 15px;min-height:40px;background:none;color:var(--sub);font-weight:700;white-space:nowrap;transition:color .15s,background .15s}
.filter:hover{color:var(--text)}
.filter[aria-pressed=true]{background:var(--bg);color:var(--text);border-color:var(--accent);font-weight:800}
.search{display:flex;align-items:center;gap:8px;width:280px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--sub)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none}
.search input::placeholder{color:var(--sub)}
.dock-wrap{position:relative;min-height:280px}
.dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) + 14px),1fr));gap:28px 12px;padding:10px 0 48px;justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.tile{--c:var(--ink);--g:var(--glow);position:relative;width:var(--tile);height:var(--tile);border-radius:calc(var(--tile)*.28);border:1px solid var(--line);background:linear-gradient(180deg,var(--tile-a),var(--tile-b));
 display:grid;place-items:center;color:var(--c);font-size:calc(var(--tile)*.39);box-shadow:0 1px 2px var(--shadow);transition:transform .24s cubic-bezier(.2,.9,.25,1.2),border-color .2s,box-shadow .25s,background .2s}
.tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
 background:radial-gradient(110px circle at var(--x,-200px) var(--y,-200px),rgba(var(--g),.6),transparent 65%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tile .ic{transition:transform .3s cubic-bezier(.2,.9,.25,1.2)}
.tile:hover,.tile:focus-visible{transform:scale(1.12);border-color:rgb(var(--g));outline:none;z-index:2;background:linear-gradient(180deg,var(--tile-ha),var(--tile-hb));
 box-shadow:0 0 0 1px rgb(var(--g)),0 0 28px -4px rgba(var(--g),.45),0 14px 30px -10px var(--shadow)}
.tile:hover .ic,.tile:focus-visible .ic{transform:scale(1.06)}
.tile:active{transform:scale(1.04)}
.tile-label{font-size:13px;font-weight:600;color:var(--sub);text-align:center;max-width:calc(var(--tile) + 24px);line-height:1.35;transition:color .2s}
.cell:hover .tile-label,.cell:focus-within .tile-label{color:var(--text)}
/* 라이트 모드 토글 타일 (보라색, 항상 맨 끝) */
.tile.theme{--c:var(--violet-ink);--g:var(--vglow);--tile-ha:var(--violet-bg);--tile-hb:var(--violet-bg);border-color:rgba(var(--vglow),.45)}
.tile.theme .ic{transition:transform .5s cubic-bezier(.2,.9,.25,1.2)}
.tile.theme:hover .ic{transform:rotate(-20deg) scale(1.06)}
.on-touch{display:none}
.no-result{color:var(--sub);padding:0 0 24px;margin:-24px 0 0}

/* 설명창 */
.pop{position:absolute;z-index:5;width:300px;padding:18px 18px 16px;border:1px solid var(--line2);border-radius:16px;background:var(--pop-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 box-shadow:0 24px 60px -16px var(--shadow),0 0 0 1px rgba(var(--glow),.08);pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.9,.25,1.2)}
.pop.show{opacity:1;transform:none}
.pop-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.pop-top b{color:var(--ink);font-weight:700;letter-spacing:.5px}
.pop h3{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:8px 0 4px}
.pop p{color:var(--sub);font-size:14px;margin:0 0 14px}
.pop-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;font-size:12px;color:var(--sub)}
.pop-foot span:last-child{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:800;font-size:13px}
.pop-foot .ic{color:var(--ink)}
.pop.violet .pop-top b,.pop.violet .pop-foot .ic{color:var(--violet-ink)}
.pop.violet{box-shadow:0 24px 60px -16px var(--shadow),0 0 0 1px rgba(var(--vglow),.12)}

/* ---- 도구 화면 ---- */
.tool-view{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 30px 30px;min-height:560px;box-shadow:0 20px 50px -30px var(--shadow)}
.tv-top{display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.tv-top>span:last-child{min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;color:var(--sub);font-weight:700;margin-right:6px;flex:none}
.back:hover{color:var(--text);border-color:var(--line2)}
.tv-icon{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--ink);font-size:23px;background:var(--icon-bg)}
.tv-title{font-size:23px;font-weight:800;letter-spacing:-.5px;display:block;line-height:1.25}
.tv-cat{font-size:13px;color:var(--sub)}
.tv-body{max-width:780px}
.note{font-size:13px;color:var(--sub);margin-top:22px;padding-top:14px;border-top:1px solid var(--line);max-width:780px}

/* 전환 애니메이션 (타일 → 도구 화면) */
::view-transition-group(*){animation-duration:.46s;animation-timing-function:cubic-bezier(.2,.85,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-old(card),::view-transition-new(card){height:100%;object-fit:none;object-position:top left}
/* 테마 전환: 토글 버튼에서 원이 퍼지는 효과 */
html.theme-vt::view-transition-old(root),html.theme-vt::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.theme-vt::view-transition-new(root){z-index:2}
html.theme-vt body{transition:none}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .32s cubic-bezier(.2,.85,.2,1)}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.rise{animation:none}.tile,.pop,body{transition:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;min-height:44px;border:1px solid var(--accent);border-radius:9px;background:var(--bg);color:var(--text);font-weight:700;text-decoration:none;transition:background .15s,filter .15s}
.btn:hover:not(:disabled){background:var(--accent-bg)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-color:var(--line2)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger);background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack.stack>*+*{margin-top:16px}
.status{color:var(--sub);margin:0;min-height:1.6em}
.status.err{color:var(--danger)}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:8px}
.input,textarea,select{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;outline:0;min-height:44px}
.input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical;display:block}
.counter{font-size:13px;color:var(--sub);text-align:right;margin-top:6px}
.counter.over{color:var(--danger)}
.hint{font-size:14px;color:var(--sub);background:var(--sunken);padding:12px 14px;border-radius:9px;margin:0}
.warn{color:var(--warn)}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--sub);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--sunken)}
.drop .ic{font-size:28px;color:var(--ink)}
.drop strong{color:var(--text)}
.drop small{font-size:13px}
.preview{display:block;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);font-weight:700;white-space:nowrap}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.opts{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;max-width:380px}
.opts label{color:var(--sub);font-weight:600}
input[type=color]{width:48px;height:40px;padding:2px;border:1px solid var(--line2);border-radius:9px;background:var(--bg)}
.qr{width:min(100%,280px);border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line)}
.qr svg{width:100%;height:auto}

canvas{display:block;max-width:100%;height:auto;border-radius:8px;cursor:crosshair}
.swatch{width:40px;height:40px;border-radius:8px;border:1px solid var(--line2)}
.hexval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.palette-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.palette-color{min-width:0;padding:0;border:1px solid var(--line2);background:var(--sunken);border-radius:12px;overflow:hidden;text-align:center}
.palette-color .paint{display:block;height:96px}
.palette-color b{display:block;padding:10px 2px;font-size:12px;letter-spacing:-.2px}
.palette-color:focus-visible{outline:2px solid var(--accent)}
.sample-stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:220px;background-color:#bbb;background-image:linear-gradient(45deg,#999 25%,transparent 25%),linear-gradient(-45deg,#999 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#999 75%),linear-gradient(-45deg,transparent 75%,#999 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.sample-stage canvas{max-height:440px;object-fit:contain;touch-action:none}
.bg-canvas-wrap{position:relative;max-width:100%;max-height:440px;line-height:0}
.bg-canvas-wrap canvas{display:block;max-height:440px;max-width:100%;width:auto;height:auto}
.bg-canvas-wrap #bg-mark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bg-canvas-wrap.guiding #bg-mark{pointer-events:auto;cursor:crosshair}
.guide-help{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);color:var(--sub);font-size:13px}
.image-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.image-pair h4{margin:0 0 8px;font-size:14px}
.image-pair img{max-width:100%;max-height:440px;object-fit:contain}
.range-field{display:flex;align-items:center;gap:12px}.range-field input{flex:1;min-width:0;accent-color:var(--accent)}

.history h4{margin:0 0 10px;font-size:15px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunken)}
.hist img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--bg)}
.hist .meta{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.hist .meta b{display:block;color:var(--text);font-size:14px}

.dl-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.dl-meta dt{color:var(--sub)}
.dl-meta dd{margin:0;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
ol.steps{margin:0;padding-left:20px;color:var(--sub)}
ol.steps li+li{margin-top:4px}

/* PDF 도구 */
.flist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunken)}
.flist li.dragging{opacity:.4}
.flist li.drop-before{box-shadow:0 -2px 0 var(--accent)}
.flist .grip{color:var(--sub);cursor:grab;font-size:16px;display:flex}
.flist .num{width:22px;text-align:center;color:var(--ink);font-weight:800;font-size:13px}
.flist img{width:36px;height:36px;object-fit:cover;border-radius:6px;background:var(--bg);flex:none}
.flist .meta{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.flist .meta b{display:block;color:var(--text);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--sub);font-size:14px;flex:none}
.icon-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;max-height:520px;overflow:auto;padding:4px}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);color:var(--sub);font-size:13px;font-weight:700}
.thumb .pg{width:100%;aspect-ratio:1/1.414;display:grid;place-items:center;background:var(--page-bg);border-radius:4px;overflow:hidden}
.thumb canvas{cursor:pointer;transition:transform .2s;max-width:100%;max-height:100%;border-radius:2px;background:#fff}
.thumb[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg);color:var(--text)}
.thumb[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;display:grid;place-items:center}
.thumb .rot{position:absolute;top:6px;left:6px;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--bg);color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.win-card{border:1px solid var(--line2);border-radius:12px;padding:16px;background:var(--sunken)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;font-size:14px;align-items:center;max-width:440px}
.conv span:nth-child(3n+2){color:var(--ink)}

footer{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:12px;border-top:1px solid var(--line);padding:18px max(var(--gutter),calc((100vw - 1240px)/2));padding-bottom:max(18px,env(safe-area-inset-bottom))}

/* ---- 반응형 ---- */
@media(max-width:1023px){
 .tool-view{padding:24px 24px 28px}
}
@media(max-width:759px){
 .label{display:none}
 .toolbar{flex-direction:column-reverse;align-items:stretch;gap:14px;margin-bottom:22px}
 .search{width:100%}
 /* 분류 버튼은 한 줄 가로 스크롤 */
 .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gutter)*-1);padding:2px var(--gutter);scroll-padding:0 var(--gutter)}
 .filters::-webkit-scrollbar{display:none}
 .dock{gap:22px 6px}
 .tool-view{padding:18px 16px 22px;min-height:0;border-radius:18px;margin:0 -4px}
 .tv-top{gap:10px;padding-bottom:16px;margin-bottom:20px}

 .tv-title{font-size:19px}
 .back span{display:none}
 .tool-view .row>.btn:not(.sm){flex:1 1 auto}
 .tool-view .row>.btn.primary{flex-basis:100%}
 .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
 .seg::-webkit-scrollbar{display:none}
 .thumbs{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:60vh}
 .opts{max-width:none}
 .palette-grid{gap:5px}.palette-color .paint{height:65px}.palette-color b{font-size:10px;padding:8px 1px}
 .image-pair{grid-template-columns:1fr}
}
@media(max-width:479px){
 .dl-meta{grid-template-columns:1fr;gap:2px}
 .dl-meta dd{margin-bottom:8px}
 .conv{font-size:13px}
 .flist li{flex-wrap:wrap}
 .flist .meta{flex-basis:calc(100% - 90px)}
 footer{flex-direction:column;gap:2px}
}
@media(pointer:coarse){.icon-btn{width:40px;height:40px}}
@media(hover:none){.on-hover{display:none}.on-touch{display:inline}.spot,.dots{display:none}.pop{display:none}.tile:hover{transform:none}}

<body>
<header class="top"><a class="brand" href="/" aria-label="WORKKIT 홈으로"><span class="logo"><i data-i="command"></i></span><span class="name">WORKKIT</span><span class="label">나의 작은 작업 도구함</span></a></header>
<div class="spot" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div>
<main>
 <section id="home">
  <div class="eyebrow">YOUR EVERYDAY TOOLBOX</div>
  <h1>필요한 도구, 한곳에서.</h1>
  <p class="lead"><span class="on-hover">아이콘에 마우스를 올리면 설명이, 누르면 바로 도구가 열립니다.</span><span class="on-touch">아이콘을 누르면 바로 도구가 열립니다.</span></p>
  <div class="toolbar">
   <div class="filters" role="group" aria-label="분류">
    <button class="filter" data-cat="전체" aria-pressed="true">전체</button>
    <button class="filter" data-cat="이미지" aria-pressed="false">이미지</button>
    <button class="filter" data-cat="영상" aria-pressed="false">영상</button>
    <button class="filter" data-cat="문서" aria-pressed="false">문서</button>
    <button class="filter" data-cat="유틸리티" aria-pressed="false">유틸리티</button>
   </div>
   <label class="search"><i data-i="search"></i><input type="search" placeholder="도구 검색" aria-label="도구 검색"></label>
  </div>
  <div class="dock-wrap">
   <div class="dock" role="list"></div>
   <p class="no-result" hidden>검색 결과가 없습니다.</p>
   <div class="pop" aria-hidden="true"></div>
  </div>
 </section>
 <section class="tool-view" id="tool" hidden aria-live="polite">
  <div class="tv-top"><button class="back" id="back" aria-label="도구 목록으로">←<span> 도구 목록</span></button><span class="tv-icon"></span><span><strong class="tv-title"></strong><span class="tv-cat"></span></span></div>
  <div id="body" class="tv-body"></div>
  <p class="note" id="note" hidden></p>
 </section>
</main>
<footer><span>WORKKIT · 자주 쓰는 도구를 가볍게</span><span>PERSONAL TOOLBOX</span></footer>
<script>
(()=>{
const ICONS={
command:'<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',

pipette:'<path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>',
youtube:'<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
'qr-code':'<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
'arrow-up-right':'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',

list:'<path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
external:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
'file-text':'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
'arrow-up':'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
'arrow-down':'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
'rotate-cw':'<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
grip:'<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>'
,'palette':'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 22a10 10 0 1 1 10-10c0 2.1-1.8 3-3.5 3H16a2 2 0 0 0-2 2v1a4 4 0 0 1-2 4Z"/>'
,'scissors':'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="m8.12 8.12 12.02 12.02M14.8 9.2 20 4 8.12 15.88"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const paint=el=>el.querySelectorAll('i[data-i]').forEach(i=>i.outerHTML=icon(i.dataset.i));
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
paint(document);

const body=$('#body'),note=$('#note'),home=$('#home'),view=$('#tool'),dock=$('.dock'),pop=$('.pop'),search=$('.search input'),noResult=$('.no-result');
let cat='전체';

/* 도구 목록 — 새 도구는 여기에 한 줄 추가 */
const TOOL_LIST=[
 {id:'heic',name:'HEIC 변환기',kind:'이미지',icon:'images',desc:'아이폰 사진을 JPG·PNG로 한 번에 변환',foot:'WINDOWS · ZIP',tags:'아이폰 사진 jpg png 변환 heic',run:()=>dlTool('heic')},
 {id:'hex',name:'HEX 코드 추출기',kind:'이미지',icon:'pipette',desc:'사진 속 색을 클릭해 HEX·RGB 추출',foot:'HEX / RGB',tags:'색상 컬러 rgb 스포이드 hex',run:()=>hexTool()},
 {id:'palette',name:'색상 팔레트 생성기',kind:'이미지',icon:'palette',desc:'이미지 대표색 추출·조화색 생성·대비 확인',foot:'브라우저 · HEX',tags:'색상 팔레트 배색 디자인 추출 조화색',run:()=>paletteTool()},
 {id:'removebg',name:'배경 제거기',kind:'이미지',icon:'scissors',desc:'AI로 배경을 지우고 투명 PNG로 저장',foot:'브라우저 · AI',tags:'누끼 배경 제거 투명 png 사진 인물 사물',run:()=>backgroundTool()},
 {id:'yt',name:'유튜브 다운로드',kind:'영상',icon:'youtube',desc:'링크만 넣으면 편집용 MP4·MP3로 저장',foot:'WINDOWS · ZIP',tags:'youtube 영상 다운로드 mp4 mp3',run:()=>dlTool('yt')},
 {id:'pdf',name:'PDF 도구',kind:'문서',icon:'file-text',desc:'PDF 합치기·페이지 떼어내기, 이미지↔PDF, 한글·워드↔PDF',foot:'브라우저 · WINDOWS',tags:'pdf 병합 합치기 분할 나누기 추출 페이지 삭제 회전 이미지 jpg png 한글 hwp 워드 word docx 변환',run:()=>pdfTool()},
 {id:'qr',name:'QR 코드 제작툴',kind:'유틸리티',icon:'qr-code',desc:'링크·텍스트·이미지를 QR로',foot:'PNG / SVG',tags:'qr 큐알 링크 텍스트 이미지 업로드',run:()=>qrTool()},
 {id:'oe',name:'홀짝 번호 매기기',kind:'유틸리티',icon:'list',desc:'폴더 속 파일에 01·03 / 02·04 번호를 한 번에',foot:'WINDOWS · ZIP',tags:'파일 이름 번호 홀수 짝수 일괄 변경 rename',run:()=>dlTool('oe')}
];
dock.innerHTML=TOOL_LIST.map(t=>`<div class="cell" role="listitem" data-id="${t.id}"><button class="tile" data-id="${t.id}" aria-label="${esc(t.name)}">${icon(t.icon)}</button><span class="tile-label">${esc(t.name)}</span></div>`).join('')
 +`<div class="cell theme-cell" role="listitem"><button class="tile theme" id="theme-btn"></button><span class="tile-label"></span></div>`; /* 테마 토글: 항상 맨 끝, 모든 분류에 표시 */
const cells=[...dock.querySelectorAll('.cell[data-id]')],tiles=[...dock.querySelectorAll('.tile[data-id]')],allTiles=[...dock.querySelectorAll('.tile')];
const themeBtn=$('#theme-btn'),root=document.documentElement,themeMeta=$('meta[name=theme-color]');
const isLight=()=>root.dataset.theme==='light';
function paintTheme(){
 const l=isLight();themeBtn.innerHTML=icon(l?'moon':'sun');
 themeBtn.setAttribute('aria-label',l?'다크 모드로 전환':'라이트 모드로 전환');themeBtn.setAttribute('aria-pressed',String(l));
 themeBtn.nextElementSibling.textContent=l?'다크 모드':'라이트 모드';themeMeta.content=l?'#ffffff':'#131313';
}
function applyTheme(light){if(light)root.dataset.theme='light';else delete root.dataset.theme;try{localStorage.setItem('workkit-theme',light?'light':'dark')}catch{}paintTheme()}
const byId=id=>TOOL_LIST.find(t=>t.id===id);

/* ---------- 필터·검색 ---------- */
function filter(){
 const q=search.value.trim().toLowerCase();let shown=0;
 cells.forEach(c=>{const t=byId(c.dataset.id),hay=(t.name+' '+t.desc+' '+t.tags+' '+t.kind).toLowerCase();const ok=(cat==='전체'||t.kind===cat)&&(!q||hay.includes(q));c.hidden=!ok;if(ok)shown++});
 noResult.hidden=shown>0;hidePop();
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filter()});
search.oninput=filter;
search.onkeydown=e=>{if(e.key==='Enter'){const f=tiles.find(t=>!t.closest('.cell').hidden);if(f)f.click()}};

/* ---------- 손전등 + 타일 테두리 빛 ---------- */
let raf=0,mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;
 document.documentElement.style.setProperty('--mx',mx+'px');document.documentElement.style.setProperty('--my',my+'px');
 if(!home.hidden)allTiles.forEach(t=>{const r=t.getBoundingClientRect();t.style.setProperty('--x',(mx-r.left)+'px');t.style.setProperty('--y',(my-r.top)+'px')});
})},{passive:true});

/* ---------- 설명창 ---------- */
let popFor=null;
function showPop(tile){
 popFor=tile;const th=tile===themeBtn,l=isLight();
 const t=th?{kind:'화면 설정',name:l?'다크 모드':'라이트 모드',desc:l?'어두운 화면으로 되돌립니다.':'밝은 배경에 어두운 글자로 바꿉니다.',foot:l?'LIGHT → DARK':'DARK → LIGHT'}:byId(tile.dataset.id);
 pop.classList.toggle('violet',th);
 pop.innerHTML=`<div class="pop-top"><b>${esc(t.kind)}</b></div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="pop-foot"><span>${esc(t.foot)}</span><span>${th?'전환':'열기'} ${icon(th?(l?'moon':'sun'):'arrow-up-right')}</span></div>`;
 const wrap=pop.parentElement.getBoundingClientRect(),r=tile.getBoundingClientRect(),gap=18,pw=300,ph=pop.offsetHeight||150;
 const left=Math.max(0,Math.min(wrap.width-pw,r.left-wrap.left+r.width/2-pw/2));
 const below=r.bottom+gap+ph<innerHeight;
 pop.style.left=left+'px';
 pop.style.top=(below?r.bottom-wrap.top+gap:r.top-wrap.top-gap-ph)+'px';
 pop.style.transformOrigin=(r.left-wrap.left+r.width/2-left)+'px '+(below?'0':'100%');
 requestAnimationFrame(()=>pop.classList.add('show'));
}
function hidePop(){popFor=null;pop.classList.remove('show')}
tiles.forEach(t=>{
 t.addEventListener('mouseenter',()=>showPop(t));t.addEventListener('focus',()=>showPop(t));
 t.addEventListener('mouseleave',()=>popFor===t&&hidePop());t.addEventListener('blur',()=>popFor===t&&hidePop());
 t.addEventListener('click',()=>openTool(t.dataset.id,true));
});

/* ---------- 라이트·다크 전환 (버튼에서 원이 퍼지는 효과) ---------- */
paintTheme();
['mouseenter','focus'].forEach(e=>themeBtn.addEventListener(e,()=>showPop(themeBtn)));
['mouseleave','blur'].forEach(e=>themeBtn.addEventListener(e,()=>popFor===themeBtn&&hidePop()));
themeBtn.addEventListener('click',()=>{
 const next=!isLight();
 if(!canMorph){applyTheme(next);if(popFor===themeBtn)showPop(themeBtn);return}
 const r=themeBtn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 hidePop();root.classList.add('theme-vt');
 const vt=document.startViewTransition(()=>applyTheme(next));
 vt.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:520,easing:'cubic-bezier(.2,.85,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
 vt.finished.finally(()=>root.classList.remove('theme-vt'));
});

/* ---------- 화면 전환 (타일이 도구 화면으로 커지는 애니메이션) ---------- */
const canMorph=typeof document.startViewTransition==='function'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
function nameTile(id,on){const t=tiles.find(x=>x.dataset.id===id);if(t){t.style.viewTransitionName=on?'card':'';t.firstElementChild.style.viewTransitionName=on?'card-icon':''}}
function nameView(on){view.style.viewTransitionName=on?'card':'';$('.tv-icon').style.viewTransitionName=on?'card-icon':''}
function renderTool(t){
 home.hidden=true;view.hidden=false;
 $('.tv-icon').innerHTML=icon(t.icon);$('.tv-title').textContent=t.name;$('.tv-cat').textContent=t.kind+' · '+t.foot;
 setNote('');t.run();scrollTo(0,0);
}
function renderHome(){view.hidden=true;home.hidden=false;body.innerHTML='';setNote('')}
let current=null;
function openTool(id,push){
 const t=byId(id);if(!t)return;hidePop();
 if(push)history.pushState({id},'','#'+id);
 current=id;
 if(!canMorph){renderTool(t);view.classList.remove('rise');void view.offsetWidth;view.classList.add('rise');return}
 nameTile(id,true);
 const vt=document.startViewTransition(()=>{nameTile(id,false);renderTool(t);nameView(true)});
 vt.finished.finally(()=>nameView(false));
}
function goHome(push){
 if(!current){renderHome();return}
 const id=current;current=null;
 if(push)history.pushState(null,'',location.pathname);
 if(!canMorph){renderHome();return}
 nameView(true);
 const vt=document.startViewTransition(()=>{nameView(false);renderHome();nameTile(id,true)});
 vt.finished.finally(()=>{nameTile(id,false);const t=tiles.find(x=>x.dataset.id===id);t&&t.focus({preventScroll:true})});
}
$('#back').onclick=()=>history.state&&history.state.id?history.back():goHome(true);
/* 상단 WORKKIT 누르면 홈(전체 목록)으로 */
$('.brand').onclick=e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();
 if(current)goHome(true);else if(location.hash)history.pushState(null,'',location.pathname);
 search.value='';cat='전체';document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cat==='전체')));filter();scrollTo({top:0,behavior:'smooth'})};
addEventListener('keydown',e=>{if(e.key==='Escape'&&current)$('#back').click()});
addEventListener('popstate',()=>{const id=location.hash.slice(1);byId(id)?openTool(id,false):goHome(false)});

function setNote(t){note.textContent=t||'';note.hidden=!t}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}

  status(st,'불러오는 중…');
  try{doc?.destroy();doc=await openJs(new Uint8Array(await f.arrayBuffer()));file=f}catch(e){return status(st,e.name==='PasswordException'?'암호가 걸린 PDF는 처리할 수 없습니다.':'열 수 없는 PDF입니다.',true)}
  $('#x-work').hidden=false;$('#x-name').textContent=`${f.name} · ${doc.numPages}쪽`;status(st,'');
 });
 $('#x-go').onclick=()=>busy(null,st,async()=>{
  const idx=$('#x-range').value.trim()?parseRange($('#x-range').value,doc.numPages):[...Array(doc.numPages).keys()];
  const jpg=$('#x-fmt').value==='jpg',dpi=+$('#x-dpi').value,files=[],w=String(doc.numPages).length;
  for(let k=0;k<idx.length;k++){
   status(st,`${k+1}/${idx.length}쪽 변환 중…`);pg.set(k/idx.length);
   const p=await doc.getPage(idx[k]+1),v1=p.getViewport({scale:1});let s=dpi/72;const max=Math.sqrt(36e6/(v1.width*v1.height));if(s>max)s=max;
   const vp=p.getViewport({scale:s}),c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:vp}).promise;
   files.push({name:`${baseName(file.name)}_${String(idx[k]+1).padStart(w,'0')}.${jpg?'jpg':'png'}`,data:await toBlob(c,jpg?'image/jpeg':'image/png',.92)});
   c.width=c.height=0;p.cleanup();
  }
  pg.set(1);
  if(files.length===1)save(files[0].data,files[0].name);else save(await makeZip(files),`${baseName(file.name)}_이미지.zip`);
  pg.done();status(st,`완료! ${files.length}장을 ${files.length>1?'ZIP으로 ':''}저장했습니다.`);
 });
}
