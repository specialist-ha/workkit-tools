<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORKKIT · 나의 작업 도구함</title>
<meta name="description" content="HEIC 변환, HEX 색상 추출, QR 코드 제작, 유튜브 다운로더, 파일 번호 매기기를 한곳에서.">
<meta name="theme-color" content="#131313">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://workkit-tools.vercel.app/">
<meta property="og:title" content="WORKKIT · 나의 작업 도구함">
<meta property="og:description" content="HEIC 변환, HEX 색상 추출, QR 코드 제작을 한곳에서.">
<meta property="og:image" content="https://workkit-tools.vercel.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/assets/qrcode.min.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#131313;--surface:#202020;--sunken:#191b1a;--text:#f2f3f2;--sub:#bfc4c1;--line:#383a39;--line2:#454746;--accent:#09ebc1;--accent-bg:#24312e;--danger:#ff7a6e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;gap:12px;padding:20px max(20px,calc((100vw - 1240px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--bg)}
.name{font-size:20px;font-weight:900;letter-spacing:-.5px}
.label{color:var(--sub);font-size:12px;margin-left:6px}

main{max-width:1296px;margin:0 auto;padding:36px 28px 48px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}
h1{font-size:38px;line-height:1.3;font-weight:900;letter-spacing:-1.5px;margin:10px 0}
.lead{color:var(--sub);margin:0 0 28px;font-weight:500}

/* ---- 손전등(스포트라이트) 배경 ---- */
.spot,.dots{position:fixed;inset:0;pointer-events:none;z-index:0}
.spot{background:radial-gradient(560px circle at var(--mx,50%) var(--my,35%),rgba(9,235,193,.075),transparent 62%)}
.dots{background-image:radial-gradient(rgba(255,255,255,.11) 1px,transparent 1.3px);background-size:22px 22px;
 -webkit-mask-image:radial-gradient(340px circle at var(--mx,50%) var(--my,35%),#000,transparent 72%);mask-image:radial-gradient(340px circle at var(--mx,50%) var(--my,35%),#000,transparent 72%)}
.top,main{position:relative;z-index:1}
.top{background:rgba(32,32,32,.86);backdrop-filter:blur(8px)}

/* ---- 런처 ---- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filter{border:1px solid transparent;border-radius:8px;padding:8px 14px;background:none;color:var(--sub);font-weight:700}
.filter[aria-pressed=true]{background:var(--bg);color:var(--text);border-color:var(--accent);font-weight:800}
.search{display:flex;align-items:center;gap:8px;width:260px;background:rgba(32,32,32,.8);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--sub)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none}
.search input::placeholder{color:var(--sub)}
.dock-wrap{position:relative;min-height:280px}
.dock{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:26px 24px;padding:10px 4px 48px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{position:relative;width:92px;height:92px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#242424,#1a1a1a);
 display:grid;place-items:center;color:var(--accent);font-size:36px;transition:transform .24s cubic-bezier(.2,.9,.25,1.2),border-color .2s,box-shadow .25s,background .2s}
.tile::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
 background:radial-gradient(110px circle at var(--x,-200px) var(--y,-200px),rgba(9,235,193,.6),transparent 65%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tile .ic{transition:transform .24s cubic-bezier(.2,.9,.25,1.2)}
.tile:hover,.tile:focus-visible{transform:scale(1.14);border-color:var(--accent);outline:none;z-index:2;background:linear-gradient(180deg,#26302d,#1b1f1e);
 box-shadow:0 0 0 1px var(--accent),0 0 28px -4px rgba(9,235,193,.45),0 14px 30px -10px rgba(0,0,0,.7)}
.tile:hover .ic,.tile:focus-visible .ic{transform:scale(1.06)}
.tile:active{transform:scale(1.06)}
.tile-label{font-size:12px;color:var(--sub);text-align:center;max-width:92px;line-height:1.35;word-break:keep-all;display:none}
.on-touch{display:none}
.no-result{color:var(--sub);padding:40px 0}

/* 설명창 */
.pop{position:absolute;z-index:5;width:300px;padding:18px 18px 16px;border:1px solid var(--line2);border-radius:16px;background:rgba(30,30,30,.94);backdrop-filter:blur(12px);
 box-shadow:0 24px 60px -16px rgba(0,0,0,.75),0 0 0 1px rgba(9,235,193,.08);pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.9,.25,1.2)}
.pop.show{opacity:1;transform:none}
.pop-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub)}
.pop-top b{color:var(--accent);font-weight:700;letter-spacing:.5px}
.pop h3{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:8px 0 4px}
.pop p{color:var(--sub);font-size:13px;margin:0 0 14px}
.pop-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;font-size:11px;color:var(--sub)}
.pop-foot span:last-child{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:800;font-size:12px}
.pop-foot .ic{color:var(--accent)}

/* ---- 도구 화면 ---- */
.tool-view{background:rgba(32,32,32,.92);border:1px solid var(--line);border-radius:22px;padding:26px 30px 30px;min-height:560px}
.tv-top{display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--sub);font-weight:700;margin-right:6px}
.back:hover{color:var(--text);border-color:var(--line2)}
.tv-icon{width:46px;height:46px;border-radius:14px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:23px;background:#1a1f1e}
.tv-title{font-size:23px;font-weight:800;letter-spacing:-.5px;display:block;line-height:1.2}
.tv-cat{font-size:12px;color:var(--sub)}
.tv-body{max-width:760px}
.note{font-size:12px;color:var(--sub);margin-top:22px;padding-top:14px;border-top:1px solid var(--line);max-width:760px}

/* 전환 애니메이션 (타일 → 도구 화면) */
::view-transition-group(*){animation-duration:.46s;animation-timing-function:cubic-bezier(.2,.85,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-old(card),::view-transition-new(card){height:100%;object-fit:none;object-position:top left}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .32s cubic-bezier(.2,.85,.2,1)}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.rise{animation:none}.tile,.pop{transition:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--text);font-weight:700;text-decoration:none}
.btn:hover:not(:disabled){background:var(--accent-bg)}
.btn.primary{background:var(--accent);color:#06221c;border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:7px 11px;font-size:12px;border-color:var(--line2)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger);background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack.stack>*+*{margin-top:16px}
.status{color:var(--sub);margin:0;min-height:1.6em}
.status.err{color:var(--danger)}
.field{display:block}
.field>span{display:block;font-weight:700;margin-bottom:8px}
.input,textarea,select{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;outline:0}
.input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical;display:block}
.counter{font-size:12px;color:var(--sub);text-align:right;margin-top:6px}
.counter.over{color:var(--danger)}
.hint{font-size:13px;color:var(--sub);background:var(--sunken);padding:12px 14px;border-radius:8px;margin:0}
.warn{color:#ffc061}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--sub);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--sunken)}
.drop .ic{font-size:26px;color:var(--accent)}
.drop strong{color:var(--text)}
.drop small{font-size:12px}
.preview{display:block;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.opts{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;max-width:360px}
.opts label{color:var(--sub);font-weight:600}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.qr{width:min(100%,280px);border-radius:10px;overflow:hidden;line-height:0}
.qr svg{width:100%;height:auto}

canvas{display:block;max-width:100%;height:auto;border-radius:8px;cursor:crosshair}
.swatch{width:40px;height:40px;border-radius:8px;border:1px solid #777}
.hexval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

.history h4{margin:0 0 10px;font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunken)}
.hist img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--bg)}
.hist .meta{flex:1;min-width:0;font-size:12px;color:var(--sub)}
.hist .meta b{display:block;color:var(--text);font-size:13px}

.dl-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.dl-meta dt{color:var(--sub)}
.dl-meta dd{margin:0;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
ol.steps{margin:0;padding-left:20px;color:var(--sub)}
ol.steps li+li{margin-top:4px}

footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px;color:var(--sub);font-size:11px;flex-wrap:wrap}

@media(max-width:759px){
 main{padding:24px 16px 40px}
 h1{font-size:29px}
 .label{display:none}
 .search{width:100%}
 .dock{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:20px 12px}
 .tile{width:72px;height:72px;border-radius:21px;font-size:29px}
 .tool-view{padding:18px 18px 22px;min-height:0;border-radius:18px}
 .tv-title{font-size:19px}
 .back span{display:none}
}
@media(hover:none){.on-hover{display:none}.on-touch{display:inline}.tile-label{display:block}.spot,.dots{display:none}.pop{display:none}}
</style>
</head>
<body>
<header class="top"><span class="logo"><i data-i="command"></i></span><span class="name">WORKKIT</span><span class="label">나의 작은 작업 도구함</span></header>
<div class="spot" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div>
<main>
 <section id="home">
  <div class="eyebrow">YOUR EVERYDAY TOOLBOX</div>
  <h1>필요한 도구, 한곳에서.</h1>
  <p class="lead"><span class="on-hover">아이콘에 마우스를 올리면 설명이, 누르면 바로 도구가 열립니다.</span><span class="on-touch">아이콘을 누르면 바로 도구가 열립니다.</span></p>
  <div class="toolbar">
   <div class="filters" role="group" aria-label="분류">
    <button class="filter" data-cat="전체" aria-pressed="true">전체</button>
    <button class="filter" data-cat="이미지" aria-pressed="false">이미지</button>
    <button class="filter" data-cat="영상" aria-pressed="false">영상</button>
    <button class="filter" data-cat="유틸리티" aria-pressed="false">유틸리티</button>
   </div>
   <label class="search"><i data-i="search"></i><input type="search" placeholder="도구 검색" aria-label="도구 검색"></label>
  </div>
  <div class="dock-wrap">
   <div class="dock" role="list"></div>
   <p class="no-result" hidden>검색 결과가 없습니다.</p>
   <div class="pop" aria-hidden="true"></div>
  </div>
 </section>
 <section class="tool-view" id="tool" hidden aria-live="polite">
  <div class="tv-top"><button class="back" id="back" aria-label="도구 목록으로">←<span> 도구 목록</span></button><span class="tv-icon"></span><span><strong class="tv-title"></strong><span class="tv-cat"></span></span></div>
  <div id="body" class="tv-body"></div>
  <p class="note" id="note" hidden></p>
 </section>
 <footer><span>WORKKIT · 자주 쓰는 도구를 가볍게</span><span>PERSONAL TOOLBOX</span></footer>
</main>
<script>
(()=>{
const ICONS={
command:'<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
images:'<path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/>',
pipette:'<path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>',
youtube:'<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
'qr-code':'<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
'arrow-up-right':'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
pointer:'<path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>',
list:'<path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
external:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const paint=el=>el.querySelectorAll('i[data-i]').forEach(i=>i.outerHTML=icon(i.dataset.i));
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
paint(document);

const body=$('#body'),note=$('#note'),home=$('#home'),view=$('#tool'),dock=$('.dock'),pop=$('.pop'),search=$('.search input'),noResult=$('.no-result');
let cat='전체';

/* 도구 목록 — 새 도구는 여기에 한 줄 추가 */
const TOOL_LIST=[
 {id:'heic',name:'HEIC 변환기',kind:'이미지',icon:'images',desc:'아이폰 사진을 JPG·PNG로 한 번에 변환',foot:'WINDOWS · ZIP',tags:'아이폰 사진 jpg png 변환 heic',run:()=>dlTool('heic')},
 {id:'hex',name:'HEX 코드 추출기',kind:'이미지',icon:'pipette',desc:'사진 속 색을 클릭해 HEX·RGB 추출',foot:'HEX / RGB',tags:'색상 컬러 rgb 스포이드 hex',run:()=>hexTool()},
 {id:'yt',name:'유튜브 다운로드',kind:'영상',icon:'youtube',desc:'링크만 넣으면 편집용 MP4·MP3로 저장',foot:'WINDOWS · ZIP',tags:'youtube 영상 다운로드 mp4 mp3',run:()=>dlTool('yt')},
 {id:'qr',name:'QR 코드 제작툴',kind:'유틸리티',icon:'qr-code',desc:'링크·텍스트·이미지를 QR로',foot:'PNG / SVG',tags:'qr 큐알 링크 텍스트 이미지 업로드',run:()=>qrTool()},
 {id:'oe',name:'홀짝 번호 매기기',kind:'유틸리티',icon:'list',desc:'폴더 속 파일에 01·03 / 02·04 번호를 한 번에',foot:'WINDOWS · ZIP',tags:'파일 이름 번호 홀수 짝수 일괄 변경 rename',run:()=>dlTool('oe')}
];
dock.innerHTML=TOOL_LIST.map(t=>`<div class="cell" role="listitem" data-id="${t.id}"><button class="tile" data-id="${t.id}" aria-label="${esc(t.name)}">${icon(t.icon)}</button><span class="tile-label">${esc(t.name)}</span></div>`).join('');
const cells=[...dock.querySelectorAll('.cell')],tiles=[...dock.querySelectorAll('.tile')];
const byId=id=>TOOL_LIST.find(t=>t.id===id);

 cells.forEach(c=>{const t=byId(c.dataset.id),hay=(t.name+' '+t.desc+' '+t.tags+' '+t.kind).toLowerCase();const ok=(cat==='전체'||t.kind===cat)&&(!q||hay.includes(q));c.hidden=!ok;if(ok)shown++});
 noResult.hidden=shown>0;hidePop();
}

 if(!home.hidden)tiles.forEach(t=>{const r=t.getBoundingClientRect();t.style.setProperty('--x',(mx-r.left)+'px');t.style.setProperty('--y',(my-r.top)+'px')});

/* ---------- 설명창 ---------- */
let popFor=null;
function showPop(tile){
 const t=byId(tile.dataset.id);popFor=tile;
 pop.innerHTML=`<div class="pop-top"><b>${esc(t.kind)}</b></div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="pop-foot"><span>${esc(t.foot)}</span><span>열기 ${icon('arrow-up-right')}</span></div>`;
 const wrap=pop.parentElement.getBoundingClientRect(),r=tile.getBoundingClientRect(),gap=18,pw=300,ph=pop.offsetHeight||150;
 const left=Math.max(0,Math.min(wrap.width-pw,r.left-wrap.left+r.width/2-pw/2));
 const below=r.bottom+gap+ph<innerHeight;
 pop.style.left=left+'px';
 pop.style.top=(below?r.bottom-wrap.top+gap:r.top-wrap.top-gap-ph)+'px';
 pop.style.transformOrigin=(r.left-wrap.left+r.width/2-left)+'px '+(below?'0':'100%');
 requestAnimationFrame(()=>pop.classList.add('show'));
}
function hidePop(){popFor=null;pop.classList.remove('show')}
tiles.forEach(t=>{
 t.addEventListener('mouseenter',()=>showPop(t));t.addEventListener('focus',()=>showPop(t));
 t.addEventListener('mouseleave',()=>popFor===t&&hidePop());t.addEventListener('blur',()=>popFor===t&&hidePop());
 t.addEventListener('click',()=>openTool(t.dataset.id,true));
});

/* ---------- 화면 전환 (타일이 도구 화면으로 커지는 애니메이션) ---------- */
const canMorph=typeof document.startViewTransition==='function'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
function nameTile(id,on){const t=tiles.find(x=>x.dataset.id===id);if(t){t.style.viewTransitionName=on?'card':'';t.firstElementChild.style.viewTransitionName=on?'card-icon':''}}

 $('.tv-icon').innerHTML=icon(t.icon);$('.tv-title').textContent=t.name;$('.tv-cat').textContent=t.kind+' · '+t.foot;
 setNote('');t.run();scrollTo(0,0);
}
function renderHome(){view.hidden=true;home.hidden=false;body.innerHTML='';setNote('')}
let current=null;
function openTool(id,push){
 const t=byId(id);if(!t)return;hidePop();
 if(push)history.pushState({id},'','#'+id);
 current=id;
 if(!canMorph){renderTool(t);view.classList.remove('rise');void view.offsetWidth;view.classList.add('rise');return}
 nameTile(id,true);
 const vt=document.startViewTransition(()=>{nameTile(id,false);renderTool(t);nameView(true)});
 vt.finished.finally(()=>nameView(false));
}
function goHome(push){
 if(!current){renderHome();return}
 const id=current;current=null;
 if(push)history.pushState(null,'',location.pathname);
 if(!canMorph){renderHome();return}
 nameView(true);
 const vt=document.startViewTransition(()=>{nameView(false);renderHome();nameTile(id,true)});
 vt.finished.finally(()=>{nameTile(id,false);const t=tiles.find(x=>x.dataset.id===id);t&&t.focus({preventScroll:true})});
}
$('#back').onclick=()=>history.state&&history.state.id?history.back():goHome(true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&current)$('#back').click()});
addEventListener('popstate',()=>{const id=location.hash.slice(1);byId(id)?openTool(id,false):goHome(false)});

/* 파일 선택 영역(클릭 + 드래그앤드롭) */
function dropzone(el,input,onFile){
 input.onchange=()=>input.files[0]&&onFile(input.files[0]);
 ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('over')}));
 ['dragleave','drop'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.remove('over')}));
 el.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)onFile(f)});
}

/* ---------- QR 제작툴 ---------- */
const HKEY='workkit-uploads',KEEP_DAYS=30,QR_MAX=2331;
function loadHist(){
 let h=[];try{h=JSON.parse(localStorage.getItem(HKEY)||'[]');const old=JSON.parse(localStorage.getItem('workkit-image-last')||'null');if(old&&old.url&&!h.some(x=>x.pathname===old.pathname))h.push({...old,at:Date.parse(old.pathname.split('/')[1])||Date.now()});localStorage.removeItem('workkit-image-last')}catch{}
 const now=Date.now();return h.filter(x=>x&&typeof x.url==='string'&&/^https:\/\//.test(x.url)&&x.pathname&&x.deleteKey&&now-x.at<KEEP_DAYS*864e5);
}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch{}}

/* 업로드 전 재인코딩: 위치정보(EXIF 등) 제거 + 긴 변 2560px 이하로 축소 */
async function cleanImage(f){
 if(f.type==='image/gif')return f; // 움직이는 GIF 보존 (GIF에는 촬영 위치 정보가 없음)
 let src;try{src=await createImageBitmap(f,{imageOrientation:'from-image'})}catch{src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
 const w=src.width,h=src.height,s=Math.min(1,2560/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
 c.getContext('2d').drawImage(src,0,0,c.width,c.height);src.close?.();
 const enc=(t,q)=>new Promise(r=>c.toBlob(r,t,q));
 let out=f.type==='image/png'?await enc('image/png'):await enc(f.type==='image/webp'?'image/webp':'image/jpeg',.9);
 if(!out||out.size>4*1024*1024)out=await enc('image/webp',.85);
 if(!out||out.size>4*1024*1024)out=await enc('image/jpeg',.75);
 return out;
}
function contrast(hex){const l=hex.match(/\w\w/g).map(v=>{v=parseInt(v,16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});const L=.2126*l[0]+.7152*l[1]+.0722*l[2];return 1.05/(L+.05)}

function qrTool(){
 body.innerHTML=`<div class="stack">

   <div id="up-pick" hidden class="stack"><img class="preview" alt="선택한 이미지 미리보기"><div class="row"><button class="btn primary" id="up-go">${icon('upload')} 업로드하고 QR 만들기</button><span class="status" id="up-name"></span></div></div>

  </div>
  <div class="opts"><label for="qr-color">코드 색상</label><input id="qr-color" type="color" value="#131313"><label for="qr-margin">여백</label><select id="qr-margin"><option value="4">기본</option><option value="6">넉넉하게</option><option value="8">넓게</option></select></div>
  <button class="btn primary" id="qr-go">QR 만들기</button>
  <p class="status" id="qr-status" role="status"></p>
  <div id="qr-out" hidden class="stack"><div class="qr"></div><div class="row"><button class="btn sm" id="png">${icon('download')} PNG</button><button class="btn sm" id="svg">${icon('download')} SVG</button></div></div>
  <div class="history" id="hist" hidden><h4>내 업로드 <small style="color:var(--sub);font-weight:400">· ${KEEP_DAYS}일 후 자동 삭제</small></h4><ul class="hist"></ul></div>
 </div>`;
 const st=$('#qr-status'),out=$('#qr-out'),box=$('.qr',out),input=$('#qr-text'),count=$('#qr-count'),color=$('#qr-color'),margin=$('#qr-margin'),go=$('#qr-go');
 let mode='url',svg='',current='',file=null,busy=false,hist=loadHist(),pv='';saveHist(hist);

 const notes={url:'입력 내용은 서버로 전송되지 않습니다.',text:'입력 내용은 서버로 전송되지 않습니다.',upload:`업로드한 이미지는 링크가 있으면 누구나 볼 수 있고, ${KEEP_DAYS}일 후 자동 삭제됩니다.`};
 function setMode(m){
  mode=m;body.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));

  setNote(notes[m]);clear();updCount();renderHist();
 }
 function clear(){out.hidden=true;svg='';status(st,'')}
 function updCount(){const n=new TextEncoder().encode(input.value).length;count.textContent=n?`${n.toLocaleString()} / ${QR_MAX.toLocaleString()}바이트`:'';count.classList.toggle('over',n>QR_MAX)}

 function make(value){
  clear();

  try{

   const c=color.value,m=Number(margin.value),n=qr.getModuleCount(),size=n+m*2;let d='';
   for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))d+=`M${x+m},${y+m}h1v1h-1z`;
   svg=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="${c}"/></svg>`;
   box.innerHTML=svg;out.hidden=false;current=value;
   const low=contrast(c)<3;status(st,low?'색이 연해서 인식이 어려울 수 있습니다. 더 진한 색을 권장합니다.':'완성! 휴대폰으로 스캔해 확인하세요.');st.classList.toggle('warn',low);
  }catch{status(st,'내용이 너무 깁니다. 줄여주세요.',true)}
 }
 function fromInput(){
  const v=input.value.trim();

 $('#png').onclick=()=>{if(!svg)return;const img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(img,0,0,1024,1024);c.toBlob(b=>{if(b)save(b,'workkit-qr.png');URL.revokeObjectURL(u)},'image/png')};img.onerror=()=>{status(st,'PNG 저장 실패. SVG로 저장하세요.',true);URL.revokeObjectURL(u)};img.src=u};
 setMode('url');
}

const startId=location.hash.slice(1);
if(byId(startId)){current=startId;renderTool(byId(startId))}
})();
